<title>Apê 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen tool — top bar, tool rail at left, 3D stage in the middle, inspector at right; on phones the rail and the inspector stack under the stage. */
:root {
  --bg: #eceeea;          /* concrete, slightly green */
  --panel: #f8f9f6;
  --stage: #dde1dc;
  --ink: #1d2320;
  --muted: #5f6964;
  --line: #d2d7d1;
  --accent: #d39a17;      /* fita de trena */
  --accent-ink: #251a02;
  --accent-soft: #f6e6bd;
  --danger: #b4412f;
  --ok: #3d7a52;
  --shadow: 0 6px 24px rgba(20, 26, 23, .14);
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131715; --panel: #1b201e; --stage: #0e1110; --ink: #e5e9e5; --muted: #98a29c; --line: #2c3430;
    --accent: #e8b33a; --accent-ink: #1d1502; --accent-soft: #3b3018; --danger: #e0715c; --ok: #6fbf8a;
    --shadow: 0 6px 24px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131715; --panel: #1b201e; --stage: #0e1110; --ink: #e5e9e5; --muted: #98a29c; --line: #2c3430;
  --accent: #e8b33a; --accent-ink: #1d1502; --accent-soft: #3b3018; --danger: #e0715c; --ok: #6fbf8a;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: 60px minmax(0, 1fr) 330px;
  grid-template-areas: "bar bar bar" "tools stage panel"; }

/* ---------- top bar ---------- */
.bar { grid-area: bar; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand span { font-family: var(--font-num); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: none; padding: 6px 11px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.bar select { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); padding: 6px 8px; max-width: 160px; }
.iconbtn { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.iconbtn:hover { border-color: var(--muted); }
.iconbtn svg { width: 16px; height: 16px; }

/* ---------- tool rail ---------- */
.tools { grid-area: tools; display: flex; flex-direction: column; gap: 4px; padding: 10px 6px; border-right: 1px solid var(--line); background: var(--panel); }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; border-radius: var(--r); padding: 8px 2px; cursor: pointer; color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: .02em; }
.tool svg { width: 22px; height: 22px; }
.tool:hover { background: var(--bg); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.tools .sep { height: 1px; background: var(--line); margin: 6px 4px; }

/* ---------- stage ---------- */
.stage { grid-area: stage; position: relative; background: var(--stage); min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--panel); border: 1px solid var(--line);
  box-shadow: var(--shadow); border-radius: 999px; padding: 7px 14px; font-size: 13px; pointer-events: none; text-align: center; text-wrap: balance; }
.hint:empty { display: none; }
.banner { position: absolute; left: 12px; bottom: 12px; right: 12px; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner p { margin: 0; flex: 1 1 260px; color: var(--muted); line-height: 1.45; }
.banner p b { color: var(--ink); }
.measure-label { position: absolute; transform: translate(-50%, -130%); background: var(--accent); color: var(--accent-ink); font-family: var(--font-num); font-weight: 500;
  font-size: 13px; padding: 3px 8px; border-radius: 4px; pointer-events: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r);
  font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.progress { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px;
  font-family: var(--font-num); font-size: 12px; box-shadow: var(--shadow); }
.drop { position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--panel) 80%, transparent);
  display: grid; place-items: center; font-size: 18px; font-weight: 600; pointer-events: none; }
.walkpad { position: absolute; right: 14px; bottom: 14px; display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 6px; }
.walkpad button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; font-size: 18px; box-shadow: var(--shadow); touch-action: none; }
.walkpad .up { grid-column: 2; grid-row: 1; } .walkpad .left { grid-column: 1; grid-row: 2; } .walkpad .down { grid-column: 2; grid-row: 2; } .walkpad .right { grid-column: 3; grid-row: 2; }

/* ---------- panel ---------- */
.panel { grid-area: panel; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; }
.tabs button { border: 0; background: none; padding: 11px 10px 9px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 0; flex: 1; }
.pane > * { flex-shrink: 0; }   /* sem isso as listas encolhem a zero quando o painel rola */
.pane h2 { font-size: 15px; margin: 0; font-weight: 700; text-wrap: balance; }
.pane h3 { font-size: 11px; margin: 4px 0 0; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.pane p { margin: 0; color: var(--muted); line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; min-width: 0; }
label.f input, label.f select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 8px; color: var(--ink); width: 100%; min-width: 0; }
label.f input[type="number"] { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
label.f input[type="color"] { padding: 2px; height: 34px; }
label.f input[type="range"] { padding: 0; accent-color: var(--accent); }
.unit { font-family: var(--font-num); font-size: 10.5px; color: var(--muted); }
label.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 13px; cursor: pointer; }
label.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 11px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--panel); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list > div { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); min-width: 0; }
.list > div:first-child { border-top: 0; }
.list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .meta { font-family: var(--font-num); font-size: 11px; color: var(--muted); }
.list > div.sel { background: var(--accent-soft); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 12px; color: var(--muted); text-align: center; line-height: 1.45; }
.thumb { width: 100%; max-height: 140px; object-fit: contain; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.readout { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.readout b { font-weight: 500; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.step { display: flex; gap: 8px; align-items: flex-start; }
.step i { font-style: normal; font-family: var(--font-num); font-size: 11px; background: var(--ink); color: var(--panel); border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; }
textarea.code { width: 100%; min-height: 120px; font-family: var(--font-num); font-size: 11px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.modal { position: fixed; inset: 0; background: rgba(10, 12, 11, .55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal > div { background: var(--panel); border-radius: 12px; padding: 16px; max-width: min(920px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.modal img { max-width: 100%; border-radius: 6px; }
kbd { font-family: var(--font-num); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--bg); }

@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 42%);
    grid-template-areas: "bar" "stage" "tools" "panel"; }
  .tools { flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--line); padding: 4px; }
  .tools .sep { display: none; }
  .tool { flex: 1; }
  .tool[aria-pressed="true"] { box-shadow: inset 0 3px 0 var(--accent); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .brand span { display: none; }
  .bar { gap: 6px 8px; }
  .hide-sm { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { USDLoader } from 'three/addons/loaders/USDLoader.js';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cm = m => Math.round(m * 1000) / 10;               // metros → cm com 1 casa
const fmtCm = m => `${cm(m).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} cm`;
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || uid();
const baseName = f => f.replace(/\.[^.]+$/, '');
const IDENT = () => ({ p: [0, 0, 0], q: [0, 0, 0, 1], s: 1 });
const deep = o => JSON.parse(JSON.stringify(o));
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

let toastTimer;
function toast(msg, ms = 2600) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}
function progress(msg) { const el = $('#progress'); el.hidden = !msg; el.textContent = msg || ''; }

/* =====================================================================
   Armazenamento: disco (serve.py), IndexedDB ou memória
   ===================================================================== */
const Store = (() => {
  let backend = 'memoria', db = null;
  const mem = new Map(), memBlobs = new Map();
  const openIDB = () => new Promise((res, rej) => {
    const r = indexedDB.open('ape3d', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('blobs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  async function init() {
    try {
      const r = await fetch('api/ping', { cache: 'no-store' });
      if (r.ok && (await r.json()).ok) { backend = 'disco'; return backend; }
    } catch (e) { /* sem servidor local */ }
    try { db = await openIDB(); backend = 'navegador'; } catch (e) { backend = 'memoria'; }
    return backend;
  }
  async function get(key) {
    try {
      if (backend === 'disco') { const r = await fetch('api/kv/' + encodeURIComponent(key), { cache: 'no-store' }); return r.ok ? await r.json() : undefined; }
      if (backend === 'navegador') return await tx('kv', 'readonly', s => s.get(key));
    } catch (e) { console.warn('Store.get', e); }
    return mem.get(key);
  }
  async function set(key, value) {
    mem.set(key, value);
    try {
      if (backend === 'disco') { await fetch('api/kv/' + encodeURIComponent(key), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) }); return; }
      if (backend === 'navegador') await tx('kv', 'readwrite', s => s.put(value, key));
    } catch (e) { console.warn('Store.set', e); }
  }
  async function putBlob(id, blob) {
    memBlobs.set(id, blob);
    try {
      if (backend === 'disco') { await fetch('api/blob/' + encodeURIComponent(id), { method: 'PUT', body: blob }); return; }
      if (backend === 'navegador') await tx('blobs', 'readwrite', s => s.put(blob, id));
    } catch (e) { console.warn('Store.putBlob', e); }
  }

  modelBounds.getCenter(_sc);
  _cv.copy(camera.position).sub(_sc).setY(0);

async function loadGlbAsset(assetId) {

    glbCache.set(assetId, (async () => {
      const b = await Store.getBlob(assetId);
      if (!b) return null;
      const gltf = await new GLTFLoader().parseAsync(await b.arrayBuffer(), '');
      const root = gltf.scene;
      const box = new THREE.Box3().setFromObject(root);
      const c = box.getCenter(new THREE.Vector3());
      root.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));

}

function rotateSplat(axis, deg) {

  const ax = axis === 'x' ? new THREE.Vector3(1, 0, 0) : axis === 'y' ? UP.clone() : new THREE.Vector3(0, 0, 1);
  const c = splatBox(mesh).getCenter(new THREE.Vector3());

let down = null;

  if (tcontrols.dragging || tcontrols.axis) return;
  down = { x: e.clientX, y: e.clientY, moved: false, button: e.button, drag: null, look: null };
  if (e.button !== 0) return;
  if (tool === 'select') {
    const id = hitItem(e.clientX, e.clientY);
    if (id) {
      if (id !== selectedId) { selectedId = id; updateSelBox(); render(); }
      startItemDrag(id, e);
      orbit.enabled = false;
    }
  }
  if (!down.drag && nav.mode === 'walk') down.look = { yaw: nav.yaw, pitch: nav.pitch };
}, { capture: true });
window.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (!down.moved && Math.hypot(dx, dy) > 5) down.moved = true;
  if (down.drag && down.moved) moveItemDrag(e);

function startItemDrag(id, e) {
  const item = getItem(id); if (!item) return;
  const pos = new THREE.Vector3().fromArray(item.pos);
  const plane = item.type === 'frame'
    ? new THREE.Plane().setFromNormalAndCoplanarPoint(new THREE.Vector3().fromArray(item.normal), pos)
    : new THREE.Plane(UP, -pos.y);
  setRay(e.clientX, e.clientY);
  const hit = new THREE.Vector3();
  if (!ray.ray.intersectPlane(plane, hit)) hit.copy(pos);
  down.drag = { id, plane, offset: pos.clone().sub(hit), snapshot: JSON.stringify(state.items) };
}
function moveItemDrag(e) {
  const dr = down.drag; const item = getItem(dr.id); if (!item) return;
  if (item.type === 'frame' && modelMeshes.length) {
    const w = wallSurface(e.clientX, e.clientY);
    if (w) {
      item.normal = w.normal.toArray();
      item.pos = new THREE.Vector3(w.point.x, w.point.y + dr.offset.y, w.point.z).addScaledVector(w.normal, 0.002).toArray();
      placeQuick(item); return;
    }
  }
  setRay(e.clientX, e.clientY);
  const hit = new THREE.Vector3();
  if (ray.ray.intersectPlane(dr.plane, hit)) {
    item.pos = hit.add(dr.offset).toArray();
    placeQuick(item);
  }
}
function endItemDrag(d) {
  if (d.moved) { history.push(d.drag.snapshot); commit(); render(); }
}

async function handleClick(cx, cy) {
  if (tool === 'select') {
    if (!hitItem(cx, cy)) { if (selectedId) { selectedId = null; updateSelBox(); render(); } }
    return;
  }
  if (tool === 'frame') return placeFrame(cx, cy);
  if (tool === 'furniture') return placeFurniture(cx, cy);
  if (tool === 'measure') {
    const p = pickPoint(cx, cy);
    if (!p) { toast('Clique numa superfície do apê'); return; }
    measureAdd(p); return;
  }
  if (tool === 'align') return alignClick(cx, cy);
  if (tool === 'floor') {
    const p = pickPoint(cx, cy);
    if (!p) { toast('Clique no chão'); return; }
    state.floorY = p.y; grid.position.y = p.y; commit(); setTool('select'); toast(`Piso definido`); return;
  }
}

async function placeFrame(cx, cy) {
  const fd = state.frameDefaults;
  const w = wallSurface(cx, cy);
  if (!w) { toast('Clique numa parede (superfície vertical)'); return; }
  pushHistory();
  const pos = w.point.clone().addScaledVector(w.normal, 0.002);
  if (fd.auto) pos.y = state.floorY + fd.center / 100;
  const n = state.items.filter(i => i.type === 'frame').length + 1;
  const item = { id: uid(), type: 'frame', name: `Quadro ${n}`, imageId: fd.imageId, w: fd.w, h: fd.h, d: fd.d, style: fd.style, mw: fd.mw, pp: fd.pp, pos: pos.toArray(), normal: w.normal.toArray() };
  state.items.push(item);

}
async function placeFurniture(cx, cy) {
  const p = floorPoint(cx, cy);

  pushHistory();
  const fd = state.furnDefaults;
  let item;
  if (fd.glbId) item = { id: uid(), type: 'glb', name: fd.glbName || 'Modelo 3D', assetId: fd.glbId, scale: 1, rot: 0, pos: p.toArray() };
  else item = { id: uid(), type: 'box', name: fd.name, L: fd.L, P: fd.P, A: fd.A, color: fd.color, opacity: 1, rot: 0, pos: p.toArray() };
  state.items.push(item);

}
function alignClick(cx, cy) {
  if (!alignMesh()) { toast('Escolha um splat na lista primeiro'); return; }
  if (align.scaleMode) {
    setRay(cx, cy); const s = hitSplats(alignSplatId);
    if (!s) { toast('Clique em cima do splat'); return; }
    if (align.scalePts.length >= 2) align.scalePts = [];
    align.scalePts.push(s.point); drawAlignMarkers(); render(); return;
  }
  if (!align.picking) return;
  setRay(cx, cy);
  if (align.step === 'splat') {
    const s = hitSplats(alignSplatId);

    align.pending = s.point; align.step = 'model';
  } else {
    const m = hitModel();
    if (!m) { toast('Clique no mesmo ponto na maquete'); return; }
    align.pairs.push({ s: align.pending, m: m.point }); align.pending = null; align.step = 'splat';
  }

}

function typing(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA'); }
window.addEventListener('keydown', e => {
  if (typing(e)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (nav.mode === 'walk' && /^(Key[WASDQE]|Arrow|Shift)/.test(e.code)) { nav.keys.add(e.code); if (e.code.startsWith('Arrow')) e.preventDefault(); return; }
  const it = selectedId && getItem(selectedId);
  if (it && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); deleteItem(it.id); return; }
  if (it && e.key.startsWith('Arrow')) { e.preventDefault(); nudge(it, e.key, e.shiftKey ? 0.1 : 0.01); return; }
  if (it && it.type !== 'frame' && e.key.toLowerCase() === 'r') { pushHistory(); it.rot = ((it.rot || 0) + (e.shiftKey ? -15 : 15) + 360) % 360; placeQuick(it); commit(); render(); return; }
  if (e.key === 'Escape') { measureClear(); if (selectedId) { selectedId = null; updateSelBox(); } setTool('select'); return; }
  const map = { v: 'select', q: 'frame', m: 'furniture', t: 'measure' };
  if (!e.ctrlKey && !e.metaKey && map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);
});
window.addEventListener('keyup', e => nav.keys.delete(e.code));
window.addEventListener('blur', () => nav.keys.clear());
function nudge(it, key, step) {
  pushHistory();
  const p = new THREE.Vector3().fromArray(it.pos);
  if (it.type === 'frame') {
    const x = new THREE.Vector3(1, 0, 0).applyQuaternion(frameQuat(it.normal));
    if (key === 'ArrowLeft') p.addScaledVector(x, -step); if (key === 'ArrowRight') p.addScaledVector(x, step);
    if (key === 'ArrowUp') p.y += step; if (key === 'ArrowDown') p.y -= step;
  } else {
    const fw = new THREE.Vector3(); camera.getWorldDirection(fw); fw.setY(0).normalize();
    const rt = new THREE.Vector3().crossVectors(fw, UP);
    if (key === 'ArrowUp') p.addScaledVector(fw, step); if (key === 'ArrowDown') p.addScaledVector(fw, -step);
    if (key === 'ArrowRight') p.addScaledVector(rt, step); if (key === 'ArrowLeft') p.addScaledVector(rt, -step);
  }
  it.pos = p.toArray(); placeQuick(it); commit(); render();
}

const SPLAT_EXT = ['ply', 'spz', 'splat', 'ksplat'];
const MODEL_EXT = ['usdz', 'usdc', 'usda', 'glb', 'gltf'];
async function leaveDemo() {
  if (!demo) return;
  demo = false; state.items = []; history.length = 0; itemGroup.clear(); itemObjs.clear(); selectedId = null; updateSelBox();
  if (state.model?.src.kind === 'demo') { state.model = null; clearModel(); }
  $('#demoBanner').hidden = true;

async function addFiles(files, intent) {
  for (const f of files) {
    const ext = f.name.split('.').pop().toLowerCase();
    try {
      if (f.type.startsWith('image/') || ['jpg', 'jpeg', 'png', 'webp', 'heic'].includes(ext)) { await setFrameImage(f); setTool('frame'); continue; }
      if (SPLAT_EXT.includes(ext)) {
        await leaveDemo();
        const blobId = 'splat-' + uid(); await Store.putBlob(blobId, f);
        let id = slug(baseName(f.name)); while (state.splats.some(s => s.id === id)) id += '-2';
        const entry = { id, name: baseName(f.name), src: { kind: 'blob', blobId, fileName: f.name }, t: IDENT(), visible: true };
        state.splats.push(entry);
        progress(`Carregando ${f.name}…`);
        await addSplatToScene(entry); progress('');
        if (!alignSplatId) alignSplatId = id;
        setView(modelMeshes.length ? 'ambos' : 'foto');
        refreshGoto(); commit(); fitView();
        toast(`Splat "${entry.name}" aberto. Use Alinhar pra encaixar na maquete.`, 4000);
        continue;
      }
      if (MODEL_EXT.includes(ext)) {
        if ((ext === 'glb' || ext === 'gltf') && intent !== 'model' && (intent === 'furniture' || tool === 'furniture')) { await setFurnitureGlb(f); continue; }
        await leaveDemo();
        const blobId = 'model-' + uid(); await Store.putBlob(blobId, f);
        state.model = { src: { kind: 'blob', blobId, fileName: f.name }, name: baseName(f.name) };
        state.hidden = [];
        await loadModel(); await rebuildItems(); commit(); fitView();
        toast(`Maquete "${f.name}" aberta`); continue;
      }
      if (ext === 'json') { await importJson(JSON.parse(await f.text())); continue; }
      toast(`Formato não reconhecido: ${f.name}`);
    } catch (err) { console.error(err); progress(''); toast(`Erro em ${f.name}: ${err.message}`, 5000); }
  }
  updateLabel(); render();
}

async function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function dataURLToBlob(u) { return (await fetch(u)).blob(); }
async function layoutPayload(items, name) {
  const assets = {};
  for (const it of items) for (const k of ['imageId', 'assetId']) {
    if (it[k] && !assets[it[k]]) { const b = await Store.getBlob(it[k]); if (b) assets[it[k]] = await blobToDataURL(b); }
  }
  return { format: 'ape3d-layout', version: 1, name, items, assets };
}
async function importJson(data) {
  if (data?.format === 'ape3d-layout') {
    for (const [id, url] of Object.entries(data.assets || {})) await Store.putBlob(id, await dataURLToBlob(url));
    const layouts = (await Store.get('layouts')) || [];
    layouts.unshift({ id: uid(), name: data.name || 'Importado', savedAt: Date.now(), items: data.items || [] });
    await Store.set('layouts', layouts);
    toast('Layout importado. Abra em Layouts para carregar.'); setTab('layouts'); return;
  }
  if (data && Array.isArray(data.splats)) {
    let n = 0;
    for (const s of data.splats) {
      const e = state.splats.find(x => x.id === s.id || x.name === s.name);
      if (e && s.transform) { e.t = s.transform; const m = splatObjs.get(e.id); if (m) applyT(m, e.t); n++; }
    }
    commit(); toast(`Alinhamento aplicado em ${n} splat(s)`); return;
  }
  toast('Esse JSON não é um layout nem um scene.json');
}
let dlNs;
async function download(name, blob) {
  // dentro do claude.ai o download passa pela capability; rodando local (serve.py) usa um link normal
  if (window.claude?.use) {
    if (dlNs === undefined) dlNs = await window.claude.use('downloads').catch(() => null);
    if (dlNs) {
      try { const r = await dlNs.save({ filename: name, data: blob }); if (r?.status === 'saved') toast('Arquivo salvo'); }
      catch (e) { if (e?.code !== 'declined') toast('Não deu pra salvar o arquivo aqui'); }
      return;
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast('Copiado'); }
  catch (e) { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.select(); } toast('Selecione e copie o texto abaixo'); }
}

function armDanger(btn, armedLabel, fn) {
  if (!btn) return;
  const label = btn.textContent; let armed = false, t;
  btn.onclick = () => {
    if (!armed) { armed = true; btn.classList.add('armed'); btn.textContent = armedLabel; t = setTimeout(() => { armed = false; btn.classList.remove('armed'); btn.textContent = label; }, 3500); return; }
    clearTimeout(t); fn();
  };
}

const rebuildSoon = debounce(it => { syncItem(it); commit(); }, 120);
function bindItem(it, map) {
  for (const [id, [key, kind]] of Object.entries(map)) {
    const el = $('#' + id); if (!el) continue;
    el.addEventListener('focus', () => pushHistory(), { once: true });
    el.addEventListener('input', () => {
      let v = el.value;
      if (kind !== 'text') { v = parseFloat(v); if (!Number.isFinite(v)) return; }
      it[key] = v;
      if (key === 'rot' || key === 'scale') { placeQuick(it); commit(); }
      else if (key === 'name') { commit(); }
      else rebuildSoon(it);
    });
    if (key === 'style') el.addEventListener('change', () => { it.style = el.value; rebuildSoon(it); });
  }
}

    <h3>Splats (fotorrealista)</h3>
    ${state.splats.length ? `<div class="list">${state.splats.map(s => `<div><label class="check" style="flex:1;min-width:0"><input type="checkbox" data-vis="${esc(s.id)}" ${s.visible !== false ? 'checked' : ''}><span class="name">${esc(s.name)}</span></label><button class="btn sm" data-go="${esc(s.id)}">Entrar</button><button class="btn sm danger" data-rm="${esc(s.id)}">Tirar</button></div>`).join('')}</div>` : '<div class="empty">Nenhum splat aberto.</div>'}
    <div class="row"><button class="btn" id="sSplat">Abrir .ply / .spz</button></div>
    ${objs.length ? `<h3>${fromPlan ? 'Móveis fixos da planta' : 'Móveis do escaneamento'}</h3><p>Esconda os que você quer substituir. Vale na Maquete e no Raio-X.</p>
      <div class="list">${objs.map(o => `<div><label class="check" style="flex:1"><input type="checkbox" data-hide="${esc(o.key)}" ${state.hidden.includes(o.key) ? '' : 'checked'}><span class="name">${esc(o.label)}</span></label></div>`).join('')}</div>` : ''}
    <h3>Luz dos objetos</h3>
    <label class="f" for="sLight">Combine com a luz do splat <input type="range" id="sLight" min="0.3" max="2.5" step="0.05" value="${state.light}"></label>
    <h3>Piso</h3>
    <div class="row"><span class="readout" style="flex:1">Piso em y = <b>${state.floorY.toFixed(3)} m</b></span><button class="btn" id="sFloor" ${splatObjs.size ? '' : 'disabled'}>Clicar no chão</button></div>
    <p>Armazenamento: <b>${Store.backend}</b>.</p>`;
  $('#sModel').onclick = () => $('#fileModel').click();
  $('#sSplat').onclick = () => $('#fileSplat').click();
  $$('input[name="smodel"]').forEach(r => r.onchange = () => switchModel(r.value));
  $$('[data-vis]').forEach(c => c.onchange = () => { const s = state.splats.find(x => x.id === c.dataset.vis); s.visible = c.checked; applyView(); commit(); });
  $$('[data-go]').forEach(b => b.onclick = () => goInside(b.dataset.go));
  $$('[data-rm]').forEach(b => armDanger(b, 'Confirmar', () => removeSplat(b.dataset.rm)));
  $$('[data-hide]').forEach(c => c.onchange = () => { const k = c.dataset.hide; state.hidden = c.checked ? state.hidden.filter(x => x !== k) : [...state.hidden, k]; applyView(); commit(); });
  $('#sLight').oninput = e => { state.light = parseFloat(e.target.value); applyLight(); commit(); };
  $('#sFloor').onclick = () => setTool('floor');
}

/* barra superior */
$$('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
$$('[data-nav]').forEach(b => b.onclick = () => setNav(b.dataset.nav));
$$('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$$('.tabs [data-tab]').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#undoBtn').onclick = undo;
$('#goto').onchange = e => {
  const v = e.target.value; e.target.value = '';
  if (v === '@all') fitView(); else if (v === '@top') fitView(true); else if (v.startsWith('@room:')) goRoom(+v.slice(6)); else if (v) goInside(v);
};
$('#shotBtn').onclick = () => {
  const vis = [selBox.visible, tcontrols.getHelper().visible]; selBox.visible = false; tcontrols.getHelper().visible = false;
  renderer.render(scene, camera);
  canvas.toBlob(blob => {
    selBox.visible = vis[0]; tcontrols.getHelper().visible = vis[1];
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div><img src="${url}" alt="Captura da vista"><div class="row"><button class="btn primary" id="shotDl">Baixar PNG</button><button class="btn" id="shotClose">Fechar</button><span class="meta">Se o download não começar, clique com o botão direito na imagem e salve.</span></div></div>`;
    document.body.appendChild(m);
    $('#shotDl', m).onclick = () => download(`ape-3d-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.png`, blob);
    const close = () => { m.remove(); URL.revokeObjectURL(url); };
    $('#shotClose', m).onclick = close; m.onclick = e => { if (e.target === m) close(); };
  }, 'image/png');
};
function bannerSeen() { try { return localStorage.getItem('ape3d-banner-planta') === '1'; } catch (e) { return false; } }
function updateBanner() {
  const b = $('#demoBanner');
  if (demo) { b.hidden = false; return; }
  if (state.model?.source === 'planta' && !state.splats.length && !bannerSeen()) {
    $('#bannerText').innerHTML = '<b>Maquete montada a partir da planta do manual.</b> Use <b>Ir para</b> pra entrar num cômodo. As medidas são do desenho e podem variar alguns centímetros: confira com trena o que for comprar no limite.';
    $('#demoOpen').hidden = true; $('#bannerClose').hidden = false; b.hidden = false;
  } else b.hidden = true;
}
$('#bannerClose').onclick = () => { try { localStorage.setItem('ape3d-banner-planta', '1'); } catch (e) { /* sem storage */ } $('#demoBanner').hidden = true; };
function updateLabel() {
  const parts = [];
  if (demo) parts.push('exemplo');
  else {
    if (state.model) parts.push(state.model.source === 'planta' ? (state.model.name || 'planta').replace('Planta do manual: ', 'planta ') : 'maquete');
    if (state.splats.length) parts.push(`${state.splats.length} splat${state.splats.length > 1 ? 's' : ''}`);
  }
  $('#sceneLabel').textContent = parts.join(' · ') || 'vazio';
}

/* =====================================================================
   Laço de renderização
   ===================================================================== */
let lastT = performance.now();
const _mid = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const now = performance.now(); const dt = Math.min((now - lastT) / 1000, 0.1); lastT = now;
  if (nav.mode === 'walk') walkStep(dt); else orbit.update();
  dollhouse();
  const d = measureDist();
  if (d) {
    const lbl = $('#measureLabel');
    _mid.copy(measure.pts[0]).add(measure.pts[1]).multiplyScalar(0.5).project(camera);
    const r = canvas.getBoundingClientRect();
    if (_mid.z < 1) {
      lbl.hidden = false; lbl.textContent = fmtCm(d);
      lbl.style.left = `${(_mid.x * 0.5 + 0.5) * r.width}px`; lbl.style.top = `${(-_mid.y * 0.5 + 0.5) * r.height}px`;
    } else lbl.hidden = true;
    const s = camera.position.distanceTo(measure.pts[0]) * 0.006;
    measure.dots.forEach(m => m.scale.setScalar(Math.max(0.006, s)));
  }
  renderer.render(scene, camera);
});

/* =====================================================================
   Início
   ===================================================================== */
async function boot() {
  resize(); themeColors(); applyLight();
  await Store.init();
  const saved = await Store.get('current');
  let sj = null;
  try { const r = await fetch('scene.json', { cache: 'no-store' }); if (r.ok) sj = await r.json(); } catch (e) { /* sem scene.json */ }
  if (saved) {
    Object.assign(state, {
      items: saved.items || [], hidden: saved.hidden || [], view: saved.view || 'foto', light: saved.light ?? 1,
      floorY: saved.floorY ?? 0, frameDefaults: { ...state.frameDefaults, ...(saved.frameDefaults || {}) }, furnDefaults: { ...state.furnDefaults, ...(saved.furnDefaults || {}) },
    });
  }
  const nm = normalizeModels(sj);
  sceneModels = nm.list;
  if (sj && (nm.list.length || (sj.splats || []).length)) {
    const savedSplats = saved?.splats || [];
    const pick = sceneModels.find(m => m.id === saved?.modelId) || sceneModels.find(m => m.id === nm.def);
    state.model = saved?.model?.src?.kind === 'blob' ? saved.model : pick ? modelFromEntry(pick) : (saved?.model || null);
    state.splats = (sj.splats || []).map(s => {
      const id = s.id || slug(s.name || s.url);
      const prev = savedSplats.find(x => x.id === id && x.src.kind === 'url');
      return { id, name: s.name || id, src: { kind: 'url', url: s.url }, t: prev?.t || s.transform || IDENT(), visible: prev ? prev.visible !== false : true };
    });
    for (const s of savedSplats) if (s.src.kind === 'blob' && !state.splats.some(x => x.id === s.id)) state.splats.push(s);
  } else if (saved && (saved.model || (saved.splats || []).length || (saved.items || []).length)) {
    state.model = saved.model || null; state.splats = saved.splats || [];
  } else {
    demo = true;
    state.model = { src: { kind: 'demo' }, name: 'Apê de exemplo' };
    state.view = 'maquete';
    const art = await demoArtBlob(); await Store.putBlob('demo-art', art);
    state.items = [
      { id: 'demo-quadro', type: 'frame', name: 'Quadro da sala', imageId: 'demo-art', w: 60, h: 80, d: 3, style: 'carvalho', mw: 2.5, pp: 4, pos: [-1.8, 1.5, 2.7 - 0.06 - 0.002], normal: [0, 0, -1] },
      { id: 'demo-tapete', type: 'box', name: 'Tapete', L: 200, P: 250, A: 1, color: '#b7a58a', opacity: 1, rot: 90, pos: [-1.8, 0, 0.9] },
      { id: 'demo-poltrona', type: 'box', name: 'Poltrona', L: 78, P: 80, A: 90, color: '#a9734a', opacity: 1, rot: 35, pos: [-3.4, 0, 0.9] },
    ];
    $('#demoBanner').hidden = false;
  }
  if (state.splats.length) alignSplatId = state.splats[0].id;
  if (!state.splats.length && state.view !== 'maquete') state.view = 'maquete';   // sem splat, a vista Foto fica vazia
  updateLabel();
  updateBanner();
  await loadModel();
  if (!modelMeshes.length) grid.position.y = state.floorY;
  await loadSplats();
  applyView();
  await rebuildItems();
  refreshGoto();
  fitView();
  render();
}
boot().catch(e => { console.error(e); toast('Erro ao iniciar: ' + e.message, 8000); });
</script>
