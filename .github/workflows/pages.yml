name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # O site/index.html não tem <!doctype>/<head> (formato de artifact); ganha o mesmo esqueleto do serve.py.
      - name: Montar o index.html
        run: python3 -c "import pathlib, serve; pathlib.Path('site/index.html').write_text(serve.pagina(), encoding='utf-8')"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
